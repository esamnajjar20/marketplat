<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2F5D45" />
    <meta name="color-scheme" content="light" />
    <title>MarketPlat</title>
    <style>
      :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #183b2b; background: #f7f8f5; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); text-align: center; background: white; border: 1px solid #e2e8e2; border-radius: 22px; padding: 30px 24px; box-shadow: 0 12px 38px #163d2812; }
      .logo { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 16px; border-radius: 18px; background: #2f5d45; color: white; font-size: 28px; font-weight: 800; }
      h1 { font-size: 1.45rem; margin: 0 0 10px; }
      p { line-height: 1.8; color: #52665a; margin: 0 0 20px; }
      button { appearance: none; border: 0; border-radius: 12px; background: #2f5d45; color: white; font: inherit; font-weight: 700; padding: 13px 20px; min-height: 48px; width: 100%; cursor: pointer; }
      button:focus-visible { outline: 3px solid #8cb99c; outline-offset: 3px; }
      button:disabled { opacity: .65; cursor: wait; }
      button.secondary { margin-top: 10px; background: #edf3ee; color: #244b35; border: 1px solid #cbdacd; }
      #status { min-height: 1.5em; margin-top: 14px; font-size: .9rem; }
      .small { font-size: .8rem; margin-top: 14px; margin-bottom: 0; }
      @media (prefers-reduced-motion: no-preference) { .logo { animation: appear .35s ease-out both; } @keyframes appear { from { transform: scale(.9); opacity: .5; } to { transform: scale(1); opacity: 1; } } }
    </style>
  </head>
  <body>
    <main aria-labelledby="title">
      <div class="logo" aria-hidden="true">م</div>
      <h1 id="title">مرحبًا بك في سوق MarketPlat</h1>
      <p id="message">نتحقق من الاتصال لفتح التطبيق…</p>
      <button id="retry" type="button" disabled>جارٍ التحقق…</button>
      <button id="open-saved" class="secondary" type="button" hidden>محاولة فتح الصفحات المحفوظة دون إنترنت</button>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="small">لن نحذف بياناتك المحفوظة عند تعذّر الاتصال.</p>
    </main>
    <script>
      (function () {
        'use strict';
        var appUrl = 'https://marketplat.esamnajjar6.workers.dev/';
        var retryButton = document.getElementById('retry');
        var savedButton = document.getElementById('open-saved');
        var message = document.getElementById('message');
        var status = document.getElementById('status');
        var checking = false;
        var redirected = false;

        function setOfflineState() {
          message.textContent = 'تعذّر الاتصال بالموقع الآن. يمكنك إعادة المحاولة عند توفر الإنترنت.';
          retryButton.disabled = false;
          retryButton.textContent = 'إعادة المحاولة';
          savedButton.hidden = false;
          status.textContent = navigator.onLine ? 'لم يستجب الموقع بعد؛ يمكنك إعادة المحاولة أو تجربة نسخة سبق حفظها.' : 'يبدو أن الجهاز غير متصل بالإنترنت. جرّب فتح نسخة محفوظة من الصفحات التي زرتها سابقًا.';
        }

        async function tryOpenApp() {
          if (checking || redirected) return;
          checking = true;
          retryButton.disabled = true;
          retryButton.textContent = 'جارٍ الاتصال…';
          message.textContent = 'نتحقق من الاتصال لفتح التطبيق…';
          status.textContent = '';

          var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
          var timeout = window.setTimeout(function () { if (controller) controller.abort(); }, 8000);
          try {
            // no-cors permits a reachability probe without reading the response body.
            // A successful opaque response still proves the origin was reachable.
            await fetch(appUrl + 'manifest.webmanifest?native-startup=1', {
              method: 'GET', mode: 'no-cors', cache: 'no-store',
              credentials: 'omit', signal: controller ? controller.signal : undefined
            });
            redirected = true;
            message.textContent = 'تم الاتصال. جارٍ فتح MarketPlat…';
            status.textContent = '';
            window.location.replace(appUrl);
          } catch (error) {
            setOfflineState();
          } finally {
            window.clearTimeout(timeout);
            checking = false;
          }
        }

        retryButton.addEventListener('click', tryOpenApp);
        // Navigate to the real hosted origin so its existing Service Worker can
        // answer from persistent Cache Storage when the network is unavailable.
        // A cross-origin probe from this bundled shell cannot be intercepted by
        // the hosted origin's Service Worker, so provide this explicit fallback.
        savedButton.addEventListener('click', function () {
          redirected = true;
          savedButton.disabled = true;
          savedButton.textContent = 'جارٍ فتح الصفحات المحفوظة…';
          window.location.replace(appUrl);
        });
        window.addEventListener('online', tryOpenApp);
        retryButton.disabled = false;
        retryButton.textContent = 'إعادة المحاولة';
        tryOpenApp();
      })();
    </script>
  </body>
</html>
