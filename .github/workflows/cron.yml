name: Scheduled Jobs (daily)

# Runs the backend cron:scheduled script once per day. GitHub Actions
# evaluates cron in UTC; the runner internally matches weekday-restricted
# jobs against Asia/Gaza (weekly reports + Sunday cleanups). Daily jobs
# run on every invocation. Every job script is idempotent.
#
# 04:00 UTC = 06:00 or 07:00 Gaza depending on DST — a quiet hour with
# low traffic so the runner never competes with user requests.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run-due-jobs:
    runs-on: ubuntu-latest
    # Jobs execute sequentially and can fall back to bounded Express batches.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install backend deps
        working-directory: apps/api
        run: npm ci

      - name: Prisma generate
        working-directory: apps/api
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Run scheduled jobs
        working-directory: apps/api
        run: npm run cron:scheduled
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ANALYTICS_RETENTION_DAYS: '90'
          GO_WORKER_URL: ${{ secrets.GO_WORKER_URL }}
          GO_WORKER_TOKEN: ${{ secrets.GO_WORKER_TOKEN }}
