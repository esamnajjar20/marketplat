name: Playwright E2E

on:
  workflow_dispatch:
    inputs:
      debug_spec:
        description: 'Run a single spec (e.g. auth.spec.ts) for debugging'
        type: string
        default: ''

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: classifieds_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/classifieds_e2e?connection_limit=5
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/classifieds_e2e
      JWT_SECRET: ci-test-jwt-secret-please-change-me-32chars
      JWT_REFRESH_SECRET: ci-test-refresh-secret-please-change-me-32c
      FRONTEND_URL: http://localhost:3000
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      TRUST_PROXY: '0'
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      E2E_SKIP_WEBSERVER: '1'
      E2E_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Seed E2E data
        working-directory: backend
        run: npm run seed:e2e

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Start backend
        working-directory: backend
        run: |
          npm start > /tmp/backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/ready > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "::error::Backend not ready"
          cat /tmp/backend.log || true
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: |
          npm start > /tmp/frontend.log 2>&1 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for frontend readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "::error::Frontend not ready"
          cat /tmp/frontend.log || true
          exit 1

      - name: Smoke test — /auth/register
        run: |
          EMAIL="e2e-smoke-$(date +%s)@example.test"
          HTTP=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:5000/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -H "Origin: http://localhost:3000" \
            -d "{\"name\":\"Smoke\",\"email\":\"$EMAIL\",\"password\":\"TestPass123!\"}") || true
          echo "Register HTTP: $HTTP"
          if [ "$HTTP" != "201" ] && [ "$HTTP" != "200" ]; then
            echo "::error::Register failed with HTTP $HTTP"
            tail -100 /tmp/backend.log || true
            exit 1
          fi

      - name: Run E2E tests
        working-directory: frontend
        run: |
          if [ -n "${{ inputs.debug_spec }}" ]; then
            echo "🎯 DEBUG: running only ${{ inputs.debug_spec }} with 1 worker"
            npx playwright test "e2e/tests/${{ inputs.debug_spec }}" --workers=1
          else
            npm run e2e
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-runtime-logs
          path: |
            /tmp/backend.log
            /tmp/frontend.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop servers
        if: always()
        run: |
          kill "$BACKEND_PID" 2>/dev/null || true
          kill "$FRONTEND_PID" 2>/dev/null || true
