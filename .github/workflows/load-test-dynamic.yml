name: Load Test (Dynamic)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'API base URL'
        required: true
        default: 'https://marketplat-api.esamnajjar6.workers.dev'
      warmup:
        description: 'Warm up edge cache first (highly recommended)'
        type: boolean
        default: true
      rate:
        description: 'Peak request rate (req/s)'
        required: true
        default: '1000'
      num_stages:
        description: 'Number of ramp-up stages'
        required: true
        default: '3'
      ramp_duration:
        description: 'Duration of each ramp-up stage (e.g. 10s, 1m)'
        required: true
        default: '10s'
      sustain_duration:
        description: 'Duration to sustain peak rate (e.g. 20s, 5m)'
        required: true
        default: '20s'
      ramp_down_duration:
        description: 'Ramp-down duration'
        required: true
        default: '10s'
      pre_allocated_vus:
        description: 'Pre-allocated VUs'
        required: true
        default: '200'
      max_vus:
        description: 'Max VUs'
        required: true
        default: '1000'
      p95_threshold:
        description: 'p95 latency threshold (ms)'
        required: true
        default: '3000'
      p99_threshold:
        description: 'p99 latency threshold (ms)'
        required: true
        default: '10000'
      error_rate_threshold:
        description: 'Max error rate (0-1)'
        required: true
        default: '0.05'

permissions:
  contents: read

jobs:
  k6-dynamic:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6
          k6 version

      - name: Warmup edge cache
        if: inputs.warmup
        run: |
          echo "🔥 Warming edge cache..."
          for path in \
            /api/v1/categories \
            /api/v1/ads?limit=10 \
            /api/v1/products?limit=10 \
            /api/v1/stores?limit=10 \
            /api/v1/service-categories ; do
            curl -so /dev/null -w "  %{http_code}  %{time_total}s  $path\n" \
              "${{ inputs.target }}$path" || true
            sleep 0.3
          done
          echo "🔥 Warmup done — waiting 2s..."
          sleep 2

      - name: Write k6 script
        run: |
          cat > /tmp/load-dynamic.js <<'K6'
          import http from 'k6/http';
          import { check } from 'k6';

          const TARGET   = __ENV.TARGET;
          const RATE     = parseInt(__ENV.RATE, 10);
          const N_STAGES = parseInt(__ENV.NUM_STAGES, 10);
          const RAMP_DUR = __ENV.RAMP_DURATION;
          const SUSTAIN  = __ENV.SUSTAIN_DURATION;
          const RAMP_DN  = __ENV.RAMP_DOWN_DURATION;
          const PRE_VUS  = parseInt(__ENV.PRE_VUS, 10);
          const MAX_VUS  = parseInt(__ENV.MAX_VUS, 10);
          const P95      = __ENV.P95;
          const P99      = __ENV.P99;
          const ERR      = __ENV.ERR_RATE;

          const stages = [];
          for (let i = 1; i <= N_STAGES; i++) {
            stages.push({
              duration: RAMP_DUR,
              target: Math.max(1, Math.floor((RATE * i) / N_STAGES)),
            });
          }
          stages.push({ duration: SUSTAIN, target: RATE });
          stages.push({ duration: RAMP_DN, target: 0 });

          export const options = {
            scenarios: {
              dynamic_load: {
                executor: 'ramping-arrival-rate',
                startRate: 0,
                timeUnit: '1s',
                preAllocatedVUs: PRE_VUS,
                maxVUs: MAX_VUS,
                stages,
                gracefulStop: '10s',
              },
            },
            thresholds: {
              http_req_duration: [`p(95)<${P95}`, `p(99)<${P99}`],
              http_req_failed:   [`rate<${ERR}`],
            },
            summaryTrendStats: ['avg', 'min', 'med', 'p(90)', 'p(95)', 'p(99)', 'max'],
          };

          const paths = [
            '/api/v1/categories',
            '/api/v1/ads?limit=10',
            '/api/v1/products?limit=10',
            '/api/v1/stores?limit=10',
            '/api/v1/service-categories',
          ];

          export default function () {
            const path = paths[Math.floor(Math.random() * paths.length)];
            const res = http.get(TARGET + path, {
              headers: { Accept: 'application/json' },
              tags: { path },
            });
            check(res, {
              'status ok': (r) => r.status === 200 || r.status === 304,
              'not 5xx': (r) => r.status < 500,
            });
          }

          export function handleSummary(data) {
            const md = [];
            md.push('# 🚀 Dynamic Load Test Report\n');
            md.push(`**Target:** \`${TARGET}\``);
            md.push(`**Peak rate:** ${RATE} req/s`);
            md.push(`**Ramp stages:** ${N_STAGES} × ${RAMP_DUR}`);
            md.push(`**Sustain:** ${SUSTAIN} @ ${RATE} req/s`);
            md.push(`**Ramp down:** ${RAMP_DN}`);
            md.push(`**Total Requests:** ${data.metrics.http_reqs?.values?.count || 0}`);
            md.push(`**Duration:** ${((data.state?.testRunDurationMs || 0) / 1000).toFixed(0)}s\n`);

            const t = data.metrics.http_req_duration?.values || {};
            md.push('## Latency\n');
            md.push('| Metric | Value |');
            md.push('|--------|-------|');
            md.push(`| avg    | ${(t.avg || 0).toFixed(0)}ms |`);
            md.push(`| p50    | ${(t['med'] || 0).toFixed(0)}ms |`);
            md.push(`| p90    | ${(t['p(90)'] || 0).toFixed(0)}ms |`);
            md.push(`| p95    | ${(t['p(95)'] || 0).toFixed(0)}ms |`);
            md.push(`| p99    | ${(t['p(99)'] || 0).toFixed(0)}ms |`);
            md.push(`| max    | ${(t.max || 0).toFixed(0)}ms |\n`);

            const failed = data.metrics.http_req_failed?.values?.rate || 0;
            const reqs = data.metrics.http_reqs?.values?.count || 0;
            const dur  = (data.state?.testRunDurationMs || 1000) / 1000;
            md.push('## Results\n');
            md.push(`- Total: **${reqs}**`);
            md.push(`- Rate: **${(reqs / dur).toFixed(0)} req/s**`);
            md.push(`- Error rate: **${(failed * 100).toFixed(2)}%**\n`);

            return {
              stdout: JSON.stringify(data.metrics, null, 2).slice(0, 3000),
              '/tmp/k6-summary.md': md.join('\n'),
              '/tmp/k6-result.json': JSON.stringify(data, null, 2),
            };
          }
          K6

      - name: Run k6 (dynamic)
        run: |
          k6 run \
            -e TARGET="${{ inputs.target }}" \
            -e RATE="${{ inputs.rate }}" \
            -e NUM_STAGES="${{ inputs.num_stages }}" \
            -e RAMP_DURATION="${{ inputs.ramp_duration }}" \
            -e SUSTAIN_DURATION="${{ inputs.sustain_duration }}" \
            -e RAMP_DOWN_DURATION="${{ inputs.ramp_down_duration }}" \
            -e PRE_VUS="${{ inputs.pre_allocated_vus }}" \
            -e MAX_VUS="${{ inputs.max_vus }}" \
            -e P95="${{ inputs.p95_threshold }}" \
            -e P99="${{ inputs.p99_threshold }}" \
            -e ERR_RATE="${{ inputs.error_rate_threshold }}" \
            /tmp/load-dynamic.js
        continue-on-error: true

      - name: Publish to job summary
        if: always()
        run: |
          if [ -f /tmp/k6-summary.md ]; then
            cat /tmp/k6-summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-dynamic-report
          path: |
            /tmp/k6-summary.md
            /tmp/k6-result.json
          retention-days: 7
