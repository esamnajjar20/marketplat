name: Sales Notifications
on:
  # Run hourly in UTC and let the script select Asia/Gaza local hours.
  # Fixed UTC slots drift by one hour when Gaza changes its UTC offset.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: sales-notifications
  cancel-in-progress: false

jobs:
  sales-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json
      - name: Install backend deps
        working-directory: apps/api
        run: npm ci
      - name: Prisma generate
        working-directory: apps/api
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Run sales notification jobs
        working-directory: apps/api
        run: npm run cron:sales-notifications
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
