name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Capacitor sync android
        working-directory: frontend
        run: |
          chmod +x android/gradlew
          npx cap sync android

      - name: Build Debug APK
        if: inputs.build_type == 'debug'
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare signing (release only)
        if: inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      - name: Build Release APK
        if: inputs.build_type == 'release'
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=/tmp/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Locate APK
        id: find
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            DIR="frontend/android/app/build/outputs/apk/debug"
          else
            DIR="frontend/android/app/build/outputs/apk/release"
          fi
          APK=$(find "$DIR" -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found in $DIR"
            find frontend/android/app/build/outputs -type f 2>/dev/null | head
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename "$APK")" >> $GITHUB_OUTPUT
          echo "size=$(du -h "$APK" | cut -f1)" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marketplat-${{ inputs.build_type }}-apk
          path: ${{ steps.find.outputs.apk_path }}
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "## APK Ready"
            echo ""
            echo "- Type: ${{ inputs.build_type }}"
            echo "- File: ${{ steps.find.outputs.apk_name }}"
            echo "- Size: ${{ steps.find.outputs.size }}"
            echo "- Commit: ${{ github.sha }}"
          } >> $GITHUB_STEP_SUMMARY
