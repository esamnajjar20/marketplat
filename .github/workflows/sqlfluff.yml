name: SQLFluff — SQL Lint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlfluff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sqlfluff
      - name: Lint SQL files
        working-directory: apps/api
        run: |
          echo "=== migrations ==="
          sqlfluff lint prisma/migrations/ \
            --dialect postgres \
            --exclude-rules L016,L031,L034 \
            || true
          echo ""
          echo "=== diagnostics ==="
          sqlfluff lint prisma/diagnostics/ \
            --dialect postgres \
            --exclude-rules L016,L031,L034 \
            || true
