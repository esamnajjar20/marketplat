name: Build Expo Mobile APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-mobile-apk.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-mobile-apk.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: build-mobile-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Type-check, test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: https://marketplat-api.esamnajjar6.workers.dev
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: apps/mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Firebase Android services (optional for PR builds)
        env:
          FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.MARKETPLAT_FIREBASE_ANDROID_JSON_BASE64 }}
          EXPECTED_FIREBASE_PROJECT_ID: ${{ secrets.MARKETPLAT_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_ANDROID_JSON_BASE64" ]; then
            echo 'Firebase Android file secret is not configured; this build will not register native FCM.'
            exit 0
          fi
          test -n "$EXPECTED_FIREBASE_PROJECT_ID" || { echo 'Set MARKETPLAT_FIREBASE_PROJECT_ID whenever the Firebase JSON secret is configured.'; exit 1; }
          printf '%s' "$FIREBASE_ANDROID_JSON_BASE64" | base64 --decode > apps/mobile/google-services.json
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('apps/mobile/google-services.json', 'utf8'));
          const packageNames = (config.client || []).map((client) => client.client_info?.android_client_info?.package_name).filter(Boolean);
          if (config.project_info?.project_id == null || !packageNames.includes('com.marketplat.mobile')) {
            throw new Error('Firebase config must contain the MarketPlat Android package com.marketplat.mobile.');
          }
          const expected = process.env.EXPECTED_FIREBASE_PROJECT_ID;
          if (expected && config.project_info.project_id !== expected) {
            throw new Error('Firebase Android config project_id does not match MARKETPLAT_FIREBASE_PROJECT_ID.');
          }
          NODE
          chmod 600 apps/mobile/google-services.json

      - name: Apply Expo native config plugins (including SQLCipher and notifications)
        run: pnpm --filter @marketplat/mobile exec expo prebuild --platform android --no-install

      - name: Check mobile TypeScript
        run: pnpm --filter @marketplat/mobile run type-check

      - name: Run mobile lint
        run: pnpm --filter @marketplat/mobile run lint

      - name: Run maintained mobile static contract tests
        run: pnpm --filter @marketplat/mobile run test

      - name: Run durable-storage/outbox tests
        run: pnpm --filter @marketplat/mobile run test:storage

      - name: Run SQLite migration and API response tests
        run: pnpm --filter @marketplat/mobile run test:sqlite

      - name: Verify Expo configuration
        working-directory: apps/mobile
        run: pnpm exec expo config --type public

      - name: Build Debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and validate APK
        id: apk
        run: |
          APK="apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "Expected APK not found: $APK"
            find apps/mobile/android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: marketplat-expo-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Build Debug AAB (test only)
        working-directory: apps/mobile/android
        run: ./gradlew bundleDebug --no-daemon --stacktrace

      - name: Locate and validate Debug AAB
        id: aab
        run: |
          AAB="apps/mobile/android/app/build/outputs/bundle/debug/app-debug.aab"
          if [ ! -s "$AAB" ]; then
            echo "Expected debug AAB not found: $AAB"
            find apps/mobile/android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          echo "path=$AAB" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$AAB" | cut -f1)" >> "$GITHUB_OUTPUT"
          sha256sum "$AAB"

      - name: Upload Debug AAB (test only)
        uses: actions/upload-artifact@v4
        with:
          name: marketplat-expo-debug-aab-test
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Expo Android APK build"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- APK size: ${{ steps.apk.outputs.size }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove injected Firebase configuration
        if: always()
        run: rm -f apps/mobile/google-services.json apps/mobile/android/app/google-services.json
