name: DB Backup

on:
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17

      - name: Dump Neon database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          # Prefer the direct connection when configured (e.g. Neon), but
          # preserve URL query parameters such as sslmode and application_name.
          CONNECTION_URL="${DIRECT_URL:-${DATABASE_URL:-}}"
          if [ -z "$CONNECTION_URL" ]; then
            echo "::error::Neither DIRECT_URL nor DATABASE_URL secret is configured"
            exit 1
          fi
          mkdir -p backup
          STAMP="$(date -u +%Y%m%d_%H%M%S)"
          FILE="backup/marketplat_${STAMP}.sql.gz"
          echo "Dumping to $FILE ..."
          pg_dump --no-owner --no-acl --no-privileges "$CONNECTION_URL" | gzip -9 > "$FILE"

          # Validate the complete gzip stream and its SQL header. A fixed
          # minimum size is not a correctness check and rejects legitimate
          # small/empty deployments.
          gzip -t "$FILE"
          HEADER="$(gzip -cd "$FILE" | sed -n '1,5p')"
          if ! printf '%s\n' "$HEADER" | grep -q 'PostgreSQL database dump'; then
            echo "::error::Dump is not a recognizable PostgreSQL plain-SQL dump"
            exit 1
          fi
          SIZE="$(stat -c %s "$FILE")"
          echo "Dump size: $SIZE bytes"
          (cd backup && sha256sum "$(basename "$FILE")" > SHA256SUMS)
          printf '{"file":"%s","sizeBytes":%s,"createdAt":"%s","format":"plain-sql-gzip"}\n' \
            "$(basename "$FILE")" "$SIZE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > backup/manifest.json
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-backup-${{ github.run_id }}
          path: |
            backup/*.sql.gz
            backup/SHA256SUMS
            backup/manifest.json
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
