name: Semgrep — Code Security

on:
  workflow_dispatch:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep
      - name: Run semgrep
        run: |
          semgrep --config=.semgrep.yml --error --verbose . || true
