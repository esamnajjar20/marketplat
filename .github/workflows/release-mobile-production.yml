name: Mobile Android Production Release (signed)

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'I confirm this is an intentional production-signed build.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Production signing is allowed only from the protected main branch.
    if: ${{ inputs.confirm_production == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Configure required reviewers and main-only deployment branch policy
    # for this environment in GitHub Settings > Environments > production.
    environment: production
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: apps/mobile/android/gradle/wrapper/gradle-wrapper.properties
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate native Android config
        run: pnpm --filter @marketplat/mobile exec expo prebuild --platform android --no-install
      - name: Type-check and tests
        run: |
          pnpm --filter @marketplat/mobile type-check
          pnpm --filter @marketplat/mobile lint
          pnpm --filter @marketplat/mobile test
          pnpm --filter @marketplat/mobile test:storage
          pnpm --filter @marketplat/mobile test:sqlite
      # Signing material is injected only into this final Gradle step. No
      # checkout, package manager, prebuild, or test action can read it.
      - name: Sign, verify, and hash production bundle
        working-directory: apps/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.MARKETPLAT_RELEASE_KEYSTORE_BASE64 }}
          MARKETPLAT_RELEASE_STORE_FILE: ${{ runner.temp }}/marketplat-release.jks
          MARKETPLAT_RELEASE_STORE_PASSWORD: ${{ secrets.MARKETPLAT_RELEASE_STORE_PASSWORD }}
          MARKETPLAT_RELEASE_KEY_ALIAS: ${{ secrets.MARKETPLAT_RELEASE_KEY_ALIAS }}
          MARKETPLAT_RELEASE_KEY_PASSWORD: ${{ secrets.MARKETPLAT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$MARKETPLAT_RELEASE_STORE_FILE"' EXIT
          test -n "$KEYSTORE_BASE64" || { echo 'Missing production keystore secret'; exit 1; }
          test -n "$MARKETPLAT_RELEASE_STORE_PASSWORD" || { echo 'Missing production store password'; exit 1; }
          test -n "$MARKETPLAT_RELEASE_KEY_ALIAS" || { echo 'Missing production key alias'; exit 1; }
          test -n "$MARKETPLAT_RELEASE_KEY_PASSWORD" || { echo 'Missing production key password'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$MARKETPLAT_RELEASE_STORE_FILE"
          chmod 600 "$MARKETPLAT_RELEASE_STORE_FILE"
          test -s "$MARKETPLAT_RELEASE_STORE_FILE"
          chmod +x gradlew
          ./gradlew :app:verifyProductionSigning --no-daemon
          ./gradlew :app:bundleRelease --no-daemon
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify -strict -certs "$AAB"
          sha256sum "$AAB" | tee "$RUNNER_TEMP/aab.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marketplat-mobile-production-signed-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Release summary
        if: always()
        run: |
          {
            echo '## Mobile production signing gate'
            echo '- AAB is only created after verifyProductionSigning.'
            echo '- The artifact is signature-verified; this workflow does not publish it to a store.'
            echo '- Configure required reviewers and branch restrictions on the protected production environment.'
            echo '- Keystore material is scoped to the Gradle signing step and removed when that step exits.'
          } >> "$GITHUB_STEP_SUMMARY"
