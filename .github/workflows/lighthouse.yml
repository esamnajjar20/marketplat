name: Lighthouse

# Manual + weekly performance check of the deployed site. Budgets mirror the
# Core Web Vitals "good" thresholds from the performance report.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to audit'
        required: false
        default: 'https://marketplat.esamnajjar6.workers.dev/'
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run Lighthouse CI (mobile, 3 runs)
        env:
          TARGET_URL: ${{ github.event.inputs.url || 'https://marketplat.esamnajjar6.workers.dev/' }}
        run: |
          npx --yes @lhci/cli@0.14.0 collect --url="$TARGET_URL" --numberOfRuns=3
          npx --yes @lhci/cli@0.14.0 assert --config=.lighthouserc.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-report
          path: .lighthouseci
