name: DB Migration (Neon -> Aiven)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE to confirm'
        required: true
        default: ''
      mode:
        description: 'Operation'
        required: true
        default: 'backup-restore'
        type: choice
        options:
          - backup-restore
          - verify-only

jobs:
  migrate:
    if: inputs.confirm == 'MIGRATE'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install PostgreSQL 18 client from PGDG
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18
          pg_dump --version

      - name: Backup from Neon
        if: inputs.mode == 'backup-restore'
        env:
          NEON_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: |
          pg_dump "$NEON_URL" --no-owner --no-privileges --no-acl --format=custom --compress=9 --file=neon-backup.dump
          ls -lh neon-backup.dump

      - name: Upload backup artifact
        if: inputs.mode == 'backup-restore'
        uses: actions/upload-artifact@v4
        with:
          name: neon-backup
          path: neon-backup.dump
          retention-days: 30

      - name: Restore to Aiven
        if: inputs.mode == 'backup-restore'
        env:
          AIVEN_URL: ${{ secrets.AIVEN_DATABASE_URL }}
        run: |
          pg_restore "$AIVEN_URL" --no-owner --no-privileges --no-acl --clean --if-exists --verbose neon-backup.dump 2>&1 | tail -50 || echo "Restore completed with warnings"

      - name: Verify counts (Neon)
        env:
          NEON_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: |
          psql "$NEON_URL" -c "SELECT 'users' AS tbl, count(*) FROM users UNION ALL SELECT 'products', count(*) FROM products UNION ALL SELECT 'ads', count(*) FROM ads UNION ALL SELECT 'messages', count(*) FROM messages;"

      - name: Verify counts (Aiven)
        env:
          AIVEN_URL: ${{ secrets.AIVEN_DATABASE_URL }}
        run: |
          psql "$AIVEN_URL" -c "SELECT 'users' AS tbl, count(*) FROM users UNION ALL SELECT 'products', count(*) FROM products UNION ALL SELECT 'ads', count(*) FROM ads UNION ALL SELECT 'messages', count(*) FROM messages;"
