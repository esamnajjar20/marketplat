name: Promotion Lifecycle (every 15 minutes)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: promotion-lifecycle
  cancel-in-progress: false

jobs:
  run-promotion-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/api
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Run promotion lifecycle sweep
        working-directory: apps/api
        run: npm run report:promotion-lifecycle
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GO_WORKER_URL: ${{ secrets.GO_WORKER_URL }}
          GO_WORKER_TOKEN: ${{ secrets.GO_WORKER_TOKEN }}
