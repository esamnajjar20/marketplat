name: E2E Only

# Workflow مستقل لتشغيل E2E فقط، بدون انتظار باقي jobs.
# مستخرج من ci.yml (job e2e) بدون if: false.

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: classifieds_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/classifieds_e2e?connection_limit=5
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/classifieds_e2e
      JWT_SECRET: ci-test-jwt-secret-please-change-me-32chars
      JWT_REFRESH_SECRET: ci-test-refresh-secret-please-change-me-32c
      FRONTEND_URL: http://localhost:3000
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      TRUST_PROXY: '0'
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # يوقف webServer الخاص بـ playwright.config.ts عن محاولة بناء/تشغيل
      # فرونت اند إضافي بنفسه: هذا الـjob يبني ويشغّل الفرونت اند صراحةً
      # في الخطوات أدناه، وE2E_BASE_URL يشير إليه مباشرة. بدون هذا
      # المتغيّر يحدث تشغيل مزدوج (بناء مكرر + تعارض منفذ 3000).
      E2E_SKIP_WEBSERVER: '1'
      E2E_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # قائمة صريحة بالمسارين بدل الاعتماد على الافتراضي التلقائي —
          # يضمن أن كاش npm يغطي backend وfrontend معًا بشكل صحيح
          # (الإعداد السابق ترك cache-dependency-path بلا تحديد).
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ── تجهيز الباك اند ──
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Verify migration files are committed
        working-directory: backend
        run: |
          if [ -z "$(ls -A prisma/migrations 2>/dev/null)" ]; then
            echo "::error::prisma/migrations is empty or missing — commit your migrations, do not rely on 'prisma migrate dev' in CI"
            exit 1
          fi

      - name: Run migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Seed E2E data
        working-directory: backend
        run: npm run seed:e2e

      - name: Build backend
        working-directory: backend
        run: npm run build

      # يعمل في الخلفية مع توجيه stdout/stderr إلى ملف بدل التوريث
      # المباشر من الـshell — بدون هذا، إغلاق الخطوة يقتل عملية الخلفية
      # ويضيع أي سجل مفيد عند فشل لاحق. $GITHUB_ENV يمرر الـPID للخطوات
      # التالية كي يمكن التحقق من حالة العملية عند التشخيص.
      - name: Start backend
        working-directory: backend
        run: |
          npm start > /tmp/backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      # فحص فوري: إن انهارت العملية خلال أول 3 ثوانٍ (env ناقص، build
      # تالف، منفذ مشغول...) فإن kill -0 يفشل هنا مباشرة بدل أن يفشل
      # لاحقًا وبشكل غامض في خطوة "Wait for backend readiness" بعد
      # دقيقة انتظار كاملة. cat للسجل فورًا يجعل سبب الانهيار واضحًا.
      - name: Verify backend process started
        run: |
          sleep 3
          if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
            echo "::error::Backend process exited immediately after start"
            cat /tmp/backend.log || true
            exit 1
          fi

      # ── تجهيز الفرونت اند ──
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      # كاش متصفحات Playwright مفتاحه إصدار الحزمة في package-lock.json؛
      # يوفر دقيقة أو أكثر من التنزيل في كل تشغيل بدل إعادة تنزيل Chromium
      # من الصفر في كل مرة. cache-hit يُستخدم فعليًا أدناه لتخطي إعادة
      # تنزيل المتصفح نفسه عند إصابة الكاش، مع إبقاء تثبيت تبعيات النظام
      # (--with-deps) في كل مرة لأنها أخف بكثير من تنزيل المتصفح ولضمان
      # توافقها مع صورة الـrunner الحالية حتى لو تغيّرت بصمت.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser binary
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        working-directory: frontend
        run: npx playwright install-deps chromium

      # انتظار جاهزية الباك اند عبر /ready بدل /health: /ready يتحقق
      # فعليًا من اتصال قاعدة البيانات وRedis (انظر healthCache.ts)،
      # بينما /health يؤكد فقط أن العملية حية بلا فحص تبعيات — وE2E
      # يحتاج كلا الاتصالين جاهزين قبل بدء الاختبارات.
      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/ready > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend readiness... ($i/30)"
            sleep 2
          done
          echo "::error::Backend did not become ready in time"
          echo "----- backend.log -----"
          cat /tmp/backend.log || true
          exit 1

      # بناء الفرونت اند صراحةً هنا (بدل تركه لـwebServer الخاص بـ
      # Playwright) يفصل بوضوح بين مرحلتي "التجهيز" و"التشغيل"، ويمنع أي
      # سباق حيث تبدأ الاختبارات بينما البناء لا يزال جاريًا.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: |
          npm start > /tmp/frontend.log 2>&1 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Verify frontend process started
        run: |
          sleep 3
          if ! kill -0 "$FRONTEND_PID" 2>/dev/null; then
            echo "::error::Frontend process exited immediately after start"
            cat /tmp/frontend.log || true
            exit 1
          fi

      # فحص جاهزية حقيقي عبر HTTP بدل sleep ثابت: يتوقف فور استجابة
      # الخادم بدلاً من انتظار مدة تقديرية قد تكون أطول أو أقصر من اللازم.
      - name: Wait for frontend readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Waiting for frontend readiness... ($i/30)"
            sleep 2
          done
          echo "::error::Frontend did not become ready in time"
          echo "----- frontend.log -----"
          cat /tmp/frontend.log || true
          exit 1

      - name: Run E2E tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # سجلات التشغيل الفعلي للباك اند والفرونت اند — ضرورية عند فشل E2E
      # لمعرفة هل السبب خطأ في التطبيق نفسه (500، استثناء غير متوقع) أم
      # في الاختبار. بدون هذا، السجل الوحيد المتاح هو مخرجات Playwright.
      - name: Upload backend & frontend runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-runtime-logs
          path: |
            /tmp/backend.log
            /tmp/frontend.log
          retention-days: 7
          if-no-files-found: ignore

      # إنهاء صريح للعمليات الخلفية بدل الاعتماد على تنظيف الـrunner
      # التلقائي عند انتهاء الـjob — يمنع أي احتمال تسرب موارد إذا أُعيد
      # استخدام نفس الـrunner لاحقًا (self-hosted runners تحديدًا).
      - name: Stop background servers
        if: always()
        run: |
          kill "$BACKEND_PID" 2>/dev/null || true
          kill "$FRONTEND_PID" 2>/dev/null || true
