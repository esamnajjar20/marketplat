name: Linkinator — Broken Links

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkinator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Wait for service
        run: sleep 5
      - name: Scan site
        run: |
          npx linkinator https://marketplat.esamnajjar6.workers.dev/ \
            --recurse \
            --concurrency 2 \
            --timeout 60000 \
            --skip "_next/static/**" \
            --skip "https://marketplat-api.*"
        continue-on-error: true
