name: Load Test (k6)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'API base URL'
        required: true
        default: 'https://marketplat-api.esamnajjar6.workers.dev'
      max_vus:
        description: 'Max virtual users (peak of the ramp)'
        required: true
        default: '200'
      duration:
        description: 'Steady-state duration at peak (seconds)'
        required: true
        default: '30'
      warmup:
        description: 'Warm up the edge cache before the ramp'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6
          k6 version

      - name: Warmup edge cache
        if: inputs.warmup
        run: |
          echo "🔥 Warmup..."
          for path in \
            /api/v1/categories \
            /api/v1/home/static \
            /api/v1/ads?limit=10 \
            "/api/v1/ads?sort=latest&city=%D8%BA%D8%B2%D8%A9" \
            "/api/v1/ads?city=rafah&limit=5" \
            /api/v1/products?limit=10 \
            /api/v1/stores?limit=10 ; do
            curl -so /dev/null -w "  %{http_code}  %{time_total}s  $path\n" \
              "${{ inputs.target }}$path" || true
            sleep 0.5
          done
          echo "🔥 Warmup done"

      - name: Write k6 script
        run: |
          cat > /tmp/load.js <<'K6'
          import http from 'k6/http';
          import { check, sleep, group } from 'k6';
          import { Trend, Counter, Rate } from 'k6/metrics';

          // ─── Custom metrics ───
          const cacheHits        = new Counter('cache_hits_total');
          const cacheMisses      = new Counter('cache_misses_total');
          const cacheOther       = new Counter('cache_other_total');
          const hitLatency       = new Trend('hit_latency_ms', true);
          const missLatency      = new Trend('miss_latency_ms', true);
          const hitRatio         = new Rate('hit_ratio');

          // ─── Options ───
          const MAX_VUS  = Number(__ENV.MAX_VUS  || 200);
          const DURATION = Number(__ENV.DURATION || 30);

          export const options = {
            scenarios: {
              ramp: {
                executor: 'ramping-vus',
                startVUs: 0,
                stages: [
                  { duration: '15s', target: Math.min(25,  MAX_VUS) },
                  { duration: '15s', target: Math.min(50,  MAX_VUS) },
                  { duration: '15s', target: Math.min(100, MAX_VUS) },
                  { duration: `${DURATION}s`, target: MAX_VUS },
                  { duration: '10s', target: 0 },
                ],
                gracefulRampDown: '5s',
              },
            },
            thresholds: {
              'http_req_failed':  ['rate<0.01'],       // < 1% errors
              'http_req_duration': ['p(95)<1500'],     // p95 < 1.5s
              'checks':           ['rate>0.99'],       // > 99% checks pass
            },
            summaryTrendStats: ['avg', 'min', 'med', 'p(90)', 'p(95)', 'p(99)', 'max'],
          };

          // ─── Test data ───
          const paths = [
            '/api/v1/categories',
            '/api/v1/home/static',
            '/api/v1/ads?limit=10',
            '/api/v1/ads?sort=latest&city=%D8%BA%D8%B2%D8%A9',
            '/api/v1/ads?city=rafah&limit=5',
            '/api/v1/products?limit=10',
            '/api/v1/stores?limit=10',
          ];

          export default function () {
            const path = paths[Math.floor(Math.random() * paths.length)];
            const url  = `${__ENV.TARGET}${path}`;

            const res = http.get(url, {
              headers: { 'Accept': 'application/json' },
              tags:    { path },
            });

            check(res, {
              'status 200': (r) => r.status === 200,
            });

            const cache = String(res.headers['X-Proxy-Cache'] || 'NONE');
            const isHit = cache.startsWith('HIT') || cache.startsWith('STALE') || cache.startsWith('KV-HIT');

            if (isHit) {
              cacheHits.add(1);
              hitLatency.add(res.timings.duration);
              hitRatio.add(1);
            } else if (cache.startsWith('MISS')) {
              cacheMisses.add(1);
              missLatency.add(res.timings.duration);
              hitRatio.add(0);
            } else {
              cacheOther.add(1);
            }

            sleep(0.05);
          }

          // ─── Custom summary ───
          export function handleSummary(data) {
            const md = [];
            md.push('# 📊 k6 Load Test Report\n');
            md.push(`**Target:** \`${__ENV.TARGET}\``);
            md.push(`**Max VUs:** ${MAX_VUS}`);
            md.push(`**Steady duration:** ${DURATION}s\n`);

            md.push('## Cache\n');
            const hits   = data.metrics.cache_hits_total?.values?.count   || 0;
            const misses = data.metrics.cache_misses_total?.values?.count || 0;
            const other  = data.metrics.cache_other_total?.values?.count  || 0;
            const total  = hits + misses + other;
            if (total > 0) {
              md.push(`- **HIT:**  ${hits} (${(hits / total * 100).toFixed(1)}%)`);
              md.push(`- **MISS:** ${misses} (${(misses / total * 100).toFixed(1)}%)`);
              md.push(`- **Other:** ${other} (${(other / total * 100).toFixed(1)}%)\n`);
            }

            const t = data.metrics.http_req_duration?.values || {};
            md.push('## Latency (all requests)\n');
            md.push(`| Metric | Value |`);
            md.push(`|--------|-------|`);
            md.push(`| avg    | ${(t.avg   || 0).toFixed(0)}ms |`);
            md.push(`| p50    | ${(t['med'] || 0).toFixed(0)}ms |`);
            md.push(`| p90    | ${(t['p(90)'] || 0).toFixed(0)}ms |`);
            md.push(`| p95    | ${(t['p(95)'] || 0).toFixed(0)}ms |`);
            md.push(`| p99    | ${(t['p(99)'] || 0).toFixed(0)}ms |`);
            md.push(`| max    | ${(t.max   || 0).toFixed(0)}ms |\n`);

            const h = data.metrics.hit_latency_ms?.values || {};
            if (h.avg) {
              md.push('## HIT latency only\n');
              md.push(`- p50: ${(h['med'] || 0).toFixed(0)}ms`);
              md.push(`- p95: ${(h['p(95)'] || 0).toFixed(0)}ms\n`);
            }
            const m = data.metrics.miss_latency_ms?.values || {};
            if (m.avg) {
              md.push('## MISS latency only\n');
              md.push(`- p50: ${(m['med'] || 0).toFixed(0)}ms`);
              md.push(`- p95: ${(m['p(95)'] || 0).toFixed(0)}ms\n`);
            }

            const reqs     = data.metrics.http_reqs?.values?.count   || 0;
            const failed   = data.metrics.http_req_failed?.values?.rate || 0;
            const duration = data.state?.testRunDurationMs / 1000 || 1;
            md.push('## Throughput\n');
            md.push(`- Total requests: **${reqs}**`);
            md.push(`- Throughput:     **${(reqs / duration).toFixed(1)} req/s**`);
            md.push(`- Error rate:     **${(failed * 100).toFixed(2)}%**\n`);

            return {
              'stdout': JSON.stringify(data.metrics, null, 2).slice(0, 4000),
              '/tmp/k6-summary.md': md.join('\n'),
              '/tmp/k6-summary.json': JSON.stringify(data, null, 2),
            };
          }
          K6

      - name: Run k6
        run: |
          k6 run \
            -e TARGET="${{ inputs.target }}" \
            -e MAX_VUS="${{ inputs.max_vus }}" \
            -e DURATION="${{ inputs.duration }}" \
            --summary-export=/tmp/k6-export.json \
            /tmp/load.js
        continue-on-error: true

      - name: Publish to job summary
        if: always()
        run: |
          if [ -f /tmp/k6-summary.md ]; then
            cat /tmp/k6-summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ k6 report missing" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-report
          path: |
            /tmp/k6-summary.md
            /tmp/k6-summary.json
            /tmp/k6-export.json
          retention-days: 30
          if-no-files-found: warn
