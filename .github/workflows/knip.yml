name: Knip — Dead Code

on:
  workflow_dispatch:

jobs:
  knip-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npx knip --include files,dependencies,exports --no-exit-code

  knip-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - working-directory: apps/api
        run: npm ci
      - working-directory: apps/api
        run: npx knip --include files,dependencies,exports --no-exit-code

  knip-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install mobile workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Scan mobile files, dependencies and exports
        working-directory: apps/mobile
        run: pnpm dlx knip@5.64.0 --include files,dependencies,exports --no-exit-code
