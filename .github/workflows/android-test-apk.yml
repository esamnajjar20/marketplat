name: Android Test APK

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/android-test-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify test APK configuration
        run: pnpm verify:apk:test

      - name: Fix hermesc path for RN 0.88
        shell: bash
        run: |
          set -euo pipefail

          HERMESC=$(find -L node_modules -type f -name hermesc -path '*/linux64-bin/*' 2>/dev/null | head -1 || true)

          if [ -z "$HERMESC" ]; then
            echo "❌ hermesc not found in node_modules"
            find node_modules -maxdepth 4 -type d -name '*hermes*' 2>/dev/null | head -10
            exit 1
          fi

          HERMESC_ABS="$(realpath "$HERMESC")"
          echo "✅ Real hermesc: $HERMESC_ABS"
          chmod +x "$HERMESC_ABS"

          EXPECTED_DIR="node_modules/react-native/sdks/hermesc/linux64-bin"
          mkdir -p "$EXPECTED_DIR"

          if [ -f "$EXPECTED_DIR/hermesc" ] && [ ! -L "$EXPECTED_DIR/hermesc" ]; then
            chmod +x "$EXPECTED_DIR/hermesc"
            echo "✅ chmod +x on existing file"
          else
            ln -sf "$HERMESC_ABS" "$EXPECTED_DIR/hermesc"
            echo "✅ Symlinked: $EXPECTED_DIR/hermesc → $HERMESC_ABS"
          fi

          ls -la "$EXPECTED_DIR/hermesc"
          test -x "$EXPECTED_DIR/hermesc"

      - name: Build Release APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find apps/mobile/android/app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marketplat-android-test-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
