name: Android Test APK

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/android-test-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "platforms;android-36" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify test APK configuration
        run: pnpm verify:apk:test

      - name: Build Release APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find apps/mobile/android/app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marketplat-android-test-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
