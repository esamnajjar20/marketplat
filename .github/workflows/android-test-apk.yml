name: Android Test APK

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify test APK configuration
        run: pnpm verify:apk:test



      - name: Set API URL for build
        shell: bash
        run: |
          echo "EXPO_PUBLIC_API_URL=https://marketplat-api.esamnajjar6.workers.dev" >> $GITHUB_ENV

      - name: Run Expo Prebuild (for native SQLCipher & Crypto)
        working-directory: apps/mobile
        run: npx expo prebuild --clean --platform android --no-install


      - name: Build Release APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find apps/mobile/android/app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marketplat-android-test-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
