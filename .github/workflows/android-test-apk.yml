name: Android Test APK

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/android-test-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify test APK configuration
        run: pnpm verify:apk:test

      - name: Fix hermesc for RN 0.88 (copy full directory)
        shell: bash
        run: |
          set -euo pipefail

          # 1) البحث عن مجلد hermes-compiler
          HERMES_PKG=$(find -L node_modules -type d -name "hermes-compiler" 2>/dev/null | head -1 || true)

          if [ -z "$HERMES_PKG" ]; then
            echo "❌ hermes-compiler not found in node_modules"
            find node_modules -maxdepth 4 -type d -name '*hermes*' 2>/dev/null | head -20
            exit 1
          fi
          echo "✅ hermes-compiler found at: $HERMES_PKG"

          # 2) نسخ مجلد hermesc بالكامل إلى المسار الذي يتوقعه Gradle
          SOURCE_HERMESC="$HERMES_PKG/hermesc"
          TARGET_DIR="node_modules/react-native/sdks/hermesc"

          if [ ! -d "$SOURCE_HERMESC" ]; then
            echo "❌ hermesc directory not found at $SOURCE_HERMESC"
            ls -la "$HERMES_PKG"
            exit 1
          fi

          rm -rf "$TARGET_DIR"
          mkdir -p "$(dirname "$TARGET_DIR")"
          cp -a "$SOURCE_HERMESC" "$TARGET_DIR"
          echo "✅ Copied hermesc from $SOURCE_HERMESC to $TARGET_DIR"

          # 3) التأكد من صلاحية التنفيذ
          find "$TARGET_DIR" -type f -name hermesc -exec chmod +x {} \;
          ls -la "$TARGET_DIR/linux64-bin/" || true

      - name: Build Release APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find apps/mobile/android/app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marketplat-android-test-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
