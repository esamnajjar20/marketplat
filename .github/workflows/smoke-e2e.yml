name: Smoke E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/smoke-e2e.yml'

jobs:
  smoke:
    name: Smoke E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: classifieds_smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/classifieds_smoke?connection_limit=5
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/classifieds_smoke
      JWT_SECRET: ci-smoke-jwt-secret-please-change-me-32chars
      JWT_REFRESH_SECRET: ci-smoke-refresh-secret-please-change-me-32c
      FRONTEND_URL: http://127.0.0.1:3000
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      TRUST_PROXY: '0'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_API_URL: http://127.0.0.1:5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Cache backend node_modules
        uses: actions/cache@v4
        id: backend-nm
        with:
          path: backend/node_modules
          key: backend-nm-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            backend-nm-${{ runner.os }}-

      - name: Install backend deps
        if: steps.backend-nm.outputs.cache-hit != 'true'
        working-directory: backend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache Prisma client
        uses: actions/cache@v4
        id: prisma-cache
        with:
          path: backend/node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('backend/prisma/schema.prisma') }}

      - name: Prisma generate + migrate
        working-directory: backend
        run: |
          if [ "${{ steps.prisma-cache.outputs.cache-hit }}" != "true" ]; then
            npx prisma generate
          else
            echo "Prisma client cache hit — skipping generate"
          fi
          npx prisma migrate deploy

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Start backend
        working-directory: backend
        run: |
          npm start > /tmp/backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/health >/dev/null; then
              echo "backend ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::backend not ready"; cat /tmp/backend.log || true; exit 1

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        id: frontend-nm
        with:
          path: frontend/node_modules
          key: frontend-nm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            frontend-nm-${{ runner.os }}-

      - name: Install frontend deps
        if: steps.frontend-nm.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            pw-chromium-${{ runner.os }}-

      - name: Install Playwright browser binary
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install chromium

      - name: Install Playwright system deps
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: |
          npm start > /tmp/frontend.log 2>&1 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000 >/dev/null; then
              echo "frontend ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::frontend not ready"; cat /tmp/frontend.log || true; exit 1

      - name: Run smoke E2E
        working-directory: frontend
        run: npx playwright test

      - name: Print logs on failure
        if: failure()
        run: |
          echo "═══ backend ═══"; tail -80 /tmp/backend.log || true
          echo "═══ frontend ═══"; tail -50 /tmp/frontend.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop servers
        if: always()
        run: |
          kill "$BACKEND_PID" 2>/dev/null || true
          kill "$FRONTEND_PID" 2>/dev/null || true
