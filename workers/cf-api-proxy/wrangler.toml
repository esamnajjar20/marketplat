name = "marketplat-api"
main = "worker.ts"
compatibility_date = "2026-11-04"

# Native Workers Cache runs before fetch(), including on *.workers.dev.
# Requires Wrangler CLI 4.69.0 or newer. The Worker Cache API remains an inner fallback.
[cache]
enabled = true

[vars]
FRONTEND_ORIGIN = "https://marketplat.esamnajjar6.workers.dev"
RENDER_ORIGIN = "https://marketplat-nz19.onrender.com"
# Prevent production registry writes from silently downgrading to a stale replica.
GATEWAY_REQUIRE_DURABLE_REGISTRY = "true"
# Both flags must be enabled only after the API durable purge outbox is deployed,
# its Worker purge URL/token are verified, and the API outbox worker is running.
# Every route-backed catalog/reference family is bypassed until purge readiness is verified.
# Purge-ready mode uses 60s fresh / 10m max age for mutable routes.
# Only with the separate long-TTL opt-in do rows use 24h fresh / 7d max age.
REFERENCE_CACHE_PURGE_READY = "false"
# Optional pipe-separated search terms; total cap is 500 including the 11 built-in defaults.
# Populate from anonymized search analytics; do not add raw user queries indiscriminately.
# SEARCH_CACHE_WHITELIST = "موبايل|سيارة|ثلاجة"
REFERENCE_CACHE_LONG_TTL_ENABLED = "false"
# Configure FRONTEND_ORIGIN in Cloudflare Worker Variables with the exact deployed
# frontend origin(s), comma-separated. Credentialed CORS fails closed if omitted.
# Private D1 feature-flag endpoint; configure separately from gateway and purge tokens:
#   npx wrangler secret put FEATURE_FLAGS_ADMIN_TOKEN
# Set the SAME secret on the frontend Worker; its server route forwards it over API_WORKER.
# GET/PUT https://<api-worker-host>/__gateway/feature-flags
# Never send this token to browser JavaScript or embed it in NEXT_PUBLIC_ variables.
# CACHE_METRICS writes cache status, route, colo, upstream milliseconds and HTTP status only.
# Every 15 minutes, health snapshots are batch-upserted into gateway_health_history in D1.
# Durable Objects remain the authoritative real-time circuit-breaker state.
# Set GO_WORKER_TOKEN to the ingress bearer secret shared by Express and this Worker.
# Optionally set GO_WORKER_TOKENS_JSON as a secret JSON map: {"analytics":"...32+ chars...","push":"..."}.
# When the map exists, every registered serviceKey must have a 32+ character token; no fallback is used.
# If multiple logical keys point to the current Go monolith process, use the same token for those keys
# (the monolith currently validates one GO_WORKER_TOKEN); separate tokens need separate Go deployments.
# Express should set GO_WORKER_URL to https://<this-worker-host>/__go to use the multi-service Go pool.
# Optional: set GATEWAY_ALLOWED_HOSTS to comma-separated public DNS suffixes.
# For frontend-origin routing, set FRONTEND_GATEWAY_HOSTS to exact public hostnames
# (comma-separated), then attach each hostname/* route to this same Worker.
# Never add one of those public hostnames as its own frontend origin (loop protection rejects it).

[[kv_namespaces]]
binding = "REFERENCE_KV"
id = "1e04b5156df44331b12eeaed3cfabe96"



# Shared health state across API Worker isolates. SQLite-backed DO works on Free/Paid plans.
[[durable_objects.bindings]]
name = "GATEWAY_HEALTH"
class_name = "GatewayHealthCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GatewayHealthCoordinator"]

[[d1_databases]]
binding = "DB"
database_name = "marketplat-cache-db"
database_id = "1a105c8b-d165-42a6-8173-2e8091a11e1d"

# Cache hit/miss and upstream timing telemetry; dataset is created on first write.
[[analytics_engine_datasets]]
binding = "CACHE_METRICS"
dataset = "marketplat_cache"

[triggers]
crons = ["0 */6 * * *", "*/15 * * * *", "30 3 * * *"]
